[project]
name = "iterm-logs-mcp"
version = "0.1.0"
description = "MCP server exposing iTerm2 tab/session logs to agents"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
